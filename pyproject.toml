[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stablecoin-risk"
version = "1.0.0"
description = "Stablecoin resilience under the GENIUS Act: SVB-crisis microstructure, volatility spillovers, peg-deviation regressions and reserve stress tests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Khush Paliwal" }]
keywords = ["stablecoins", "market microstructure", "TVP-VAR", "stress testing", "USDC", "USDT"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "requests>=2.31",
    "tabulate>=0.9",
]

[project.optional-dependencies]
exploratory = ["arch>=6.0"]
dev = ["pytest>=7.4", "ruff>=0.4", "nbformat>=5.9", "nbconvert>=7.0", "ipykernel>=6.0"]

[project.scripts]
stablecoin-risk = "stablecoin_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]
